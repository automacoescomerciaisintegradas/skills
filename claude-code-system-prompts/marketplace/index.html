<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketplace - Claude Code System Prompts</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --line: #dbe5f0;
        --brand: #0b7a75;
        --brand-2: #134e4a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 0 0, #d7f3ef 0%, transparent 35%),
          radial-gradient(circle at 100% 0, #dce8ff 0%, transparent 30%),
          var(--bg);
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }
      .hero {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #fff;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .hero h1 { margin: 0 0 8px; font-size: 24px; }
      .hero p { margin: 0; opacity: 0.95; }
      .controls {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 10px;
        margin: 14px 0 18px;
      }
      input, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        background: #fff;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .chip {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 10px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .card h3 { margin: 0 0 8px; font-size: 16px; }
      .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
      .path {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--brand-2);
        text-decoration: none;
        font-size: 12px;
      }
      .empty { margin-top: 16px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <h1>Claude Code Prompts Marketplace</h1>
        <p>Catálogo web dos prompts importados de Piebald-AI com busca e filtros.</p>
      </section>

      <div class="controls">
        <input id="q" placeholder="Buscar por nome de arquivo, título ou categoria..." />
        <select id="category">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <div class="stats" id="stats"></div>
      <div class="grid" id="list"></div>
      <p class="empty" id="empty" hidden>Nenhum prompt encontrado para esse filtro.</p>
    </div>

    <script>
      const listEl = document.getElementById("list");
      const statsEl = document.getElementById("stats");
      const categoryEl = document.getElementById("category");
      const qEl = document.getElementById("q");
      const emptyEl = document.getElementById("empty");

      let prompts = [];

      function renderStats(meta) {
        const parts = [
          ["Total", meta.total_prompts],
          ...Object.entries(meta.categories).sort((a, b) => a[0].localeCompare(b[0]))
        ];
        statsEl.innerHTML = parts
          .map(([k, v]) => `<span class="chip"><strong>${k}</strong>: ${v}</span>`)
          .join("");
      }

      function renderCategories(meta) {
        const opts = Object.keys(meta.categories).sort((a, b) => a.localeCompare(b));
        for (const cat of opts) {
          const op = document.createElement("option");
          op.value = cat;
          op.textContent = cat;
          categoryEl.appendChild(op);
        }
      }

      function filterPrompts() {
        const q = qEl.value.trim().toLowerCase();
        const cat = categoryEl.value;
        return prompts.filter((p) => {
          const matchCat = !cat || p.category === cat;
          const bag = `${p.file} ${p.title} ${p.category}`.toLowerCase();
          const matchQ = !q || bag.includes(q);
          return matchCat && matchQ;
        });
      }

      function renderList() {
        const data = filterPrompts();
        emptyEl.hidden = data.length !== 0;
        listEl.innerHTML = data
          .map((p) => {
            const githubPath = `https://github.com/automacoescomerciaisintegradas/skills/blob/main/claude-code-system-prompts/${p.path}`;
            return `
              <article class="card">
                <h3>${p.title}</h3>
                <div class="meta">
                  <span>${p.file}</span> · <span>${p.category}</span>
                </div>
                <a class="path" href="${githubPath}" target="_blank" rel="noreferrer">${p.path}</a>
              </article>
            `;
          })
          .join("");
      }

      async function init() {
        const response = await fetch("./prompts.json");
        const data = await response.json();
        prompts = data.prompts;
        renderStats(data);
        renderCategories(data);
        renderList();
      }

      qEl.addEventListener("input", renderList);
      categoryEl.addEventListener("change", renderList);
      init();
    </script>
  </body>
</html>
